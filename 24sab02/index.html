<script>
(function(){
  const params = new URLSearchParams(window.location.search);
  let video = params.get("v") || "jOFAnBRw1";

  if(!/^https?:\/\//i.test(video)){
    video = "https://cdn.videy.co/" + video;
    if(!video.endsWith(".mp4")) video += ".mp4";
  }

  const player = document.getElementById("player");
  const source = document.getElementById("videoSource");
  const loader = document.getElementById("videoLoader");

  source.src = video;
  player.muted = true;
  player.load();

  function startVideo(){
    player.play().then(function(){
      loader.style.display = "none";
    }).catch(function(){
      loader.textContent = "Tekan tombol Play untuk memulai video";
      loader.style.display = "flex";
    });
  }

  player.addEventListener("canplay", startVideo, {once:true});

  player.addEventListener("playing", function(){
    loader.style.display = "none";
  });

  player.addEventListener("error", function(){
    loader.textContent = "Video gagal dimuat. Periksa URL video.";
    loader.style.display = "flex";
  });

  setTimeout(startVideo, 1000);
})();
</script>
